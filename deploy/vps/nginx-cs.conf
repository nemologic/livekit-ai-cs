# VPS(/etc/nginx/sites-available/cs.esimbongsa.com) — HTTPS 설정은 certbot --nginx 가 덧붙인다
server {
    server_name cs.esimbongsa.com;

    root /var/www/cs.esimbongsa.com;
    index index.html;

    # 토큰 서버 (pm2: cs-token)
    location /token {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # LiveKit — 사용자 접속(/rtc), Mac Studio 에이전트 접속(/agent), 서버 API(/twirp)
    location ~ ^/(rtc|agent|twirp) {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Flutter 웹 빌드
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 80;
}
